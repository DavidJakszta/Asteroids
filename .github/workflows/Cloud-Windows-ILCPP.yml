name: Cloud Windows-ILCPP-Build on Windows

on: [workflow_dispatch]

jobs:
  build:
    name: Build Windows-ILCPP-Build on Windows Cloud Runner
    runs-on: windows-latest
    steps:
      # Checkout (without LFS)
      - name: Checkout repository
        uses: actions/checkout@v4

      # Git LFS
      - name: Create LFS file list
        shell: sh
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v4
        id: lfs-cache
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Git LFS Pull
        run: |
          git lfs pull
          git add .
          git reset --hard

      # Cache
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      # # Test
      # - name: Run tests
      #   uses: game-ci/unity-test-runner@v4
      #   env:
      #     UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      #     UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      #     UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      #   with:
      #     githubToken: ${{ secrets.GITHUB_TOKEN }}

      # Build
      - name: Build project - using unity-builder@v4
        uses: DavidJakszta/unity-builder@874ab1b6b74a1c738d930943e18cacbd7ef89774
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows
          buildMethod: BuildScript.PerformWindowsBuild_ILCPP${{ inputs.build-method }}
          #runAsHostUser: true
          #dockerWorkspacePath: /github/workspace
          #customImage: david3216849/windows-2021.3.22f1-il2cpp-2-with-unity-path
          #containerRegistryImageVersion: 1

      # Output
      - uses: actions/upload-artifact@v4
        with:
          name: Builds
          path: Builds

          